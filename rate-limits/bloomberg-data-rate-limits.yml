specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Bloomberg Data
providerId: bloomberg-data
created: '2026-05-04'
modified: '2026-08-27'
generated: '2026-08-27'
method: searched
source: >-
  https://api.bloomberg.com/eap/ (401), https://api.bloomberg.com/eap/catalogs/ (401),
  https://professional.bloomberg.com/products/data/data-license/ (200),
  https://console.blpprofessional.com/about/82 (200, JS-rendered)
tags:
  - Analytics
  - Financial Services
  - Market Data
  - News
  - Real-Time Data
  - Trading
  - Rate Limiting
  - Quotas
  - Throttling
description: >-
  Bloomberg publishes no rate limits, quotas or throttling headers for the Data License / Hypermedia
  REST API on any page reachable without a credential. Data License volume is a contractual term
  (daily security counts, dataset entitlements, delivery windows), and B-PIPE capacity is provisioned
  as concurrent subscription limits on the customer's own appliance — neither is expressed as a public
  per-minute API limit. This file replaces a 2026-05-04 bulk-sweep scaffold that invented free /
  professional / enterprise request-per-minute tiers and X-RateLimit-* headers that Bloomberg has
  never documented and that no live response was observed to return.
limit_count: 0
limits: []
headers:
  observed: []
  documented: []
  note: >-
    Unauthenticated 401/403 responses from api.bloomberg.com return no RateLimit-*, X-RateLimit-* or
    Retry-After header. Whether authenticated responses carry one cannot be established without a credential.
responseCodes:
  observed:
    - code: 401
      meaning: No JWT presented (unauthorized_client).
    - code: 403
      meaning: access_denied at the API edge for paths outside the entitled surface.
  throttled: unknown
evidence:
  - url: https://api.bloomberg.com/eap/
    status: 401
    detail: No rate-limit header of any kind in the response.
  - url: https://api.bloomberg.com/eap/catalogs/
    status: 401
    detail: No rate-limit header of any kind in the response.
  - url: https://console.blpprofessional.com/about/82
    status: 200
    detail: >-
      Bloomberg's "Web API Connectivity Policy" page — the most likely home for published limits —
      renders entirely client-side ("You need to enable JavaScript to run this app") and is a
      customer-console page, so no limit text is machine-readable.
