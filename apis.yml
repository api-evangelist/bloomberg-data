aid: bloomberg-data
name: Bloomberg Data
description: 'Bloomberg''s enterprise market-data API surface. The Data License / Hypermedia (HAPI) REST API on
  api.bloomberg.com delivers reference, pricing, regulatory, ESG, fundamentals, estimates and historical content
  — 100B+ data points a day across 70M+ instruments, 40k+ fields and 8k+ datasets — request/response and by subscription,
  alongside SFTP and native cloud delivery. B-PIPE delivers real-time streaming quotes, trades and market depth,
  consumed not over HTTP but through the BLPAPI SDK over a TCP session against a customer-provisioned appliance.
  Both are contracted enterprise products: there is no self-service signup, no published pricing, and no public
  machine-readable contract, though Bloomberg does publish OAuth protected-resource and authorization-server metadata.'
