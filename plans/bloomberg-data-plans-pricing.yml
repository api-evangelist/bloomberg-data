description: >-
  Bloomberg publishes NO plans and NO prices for the Data License or B-PIPE APIs. Access is an
  enterprise contract negotiated with a Bloomberg sales team; the public product page offers a
  demo request and phone numbers, not a pricing table, and the data catalog at data.bloomberg.com
  requires a login before any commercial term is shown. This file replaces a 2026-05-04 bulk-sweep
  scaffold that invented Free / Professional / Enterprise tiers with request quotas and rate limits
  Bloomberg has never published — none of those tiers exist.
